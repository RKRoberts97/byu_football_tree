119,1973,NFL,3,66,NOR,Pete Van Valkenberg,RB,Brigham Young,LaVell Edwards
120,1973,NFL,15,383,DET,Dan Hansen,DB,Brigham Young,LaVell Edwards`;

        // Parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index];
                });
                data.push(obj);
            }
            return data;
        }

        // Position categorization for colors
        function categorizePosition(pos) {
            if (pos === 'QB') return 'qb';
            if (['RB', 'FB'].includes(pos)) return 'rb';
            if (pos === 'WR') return 'wr';
            if (pos === 'TE') return 'te';
            if (['T', 'G', 'C'].includes(pos)) return 'ol';
            if (['DE', 'DT', 'NT'].includes(pos)) return 'dl';
            if (pos === 'LB') return 'lb';
            if (pos === 'DB') return 'db';
            if (['K', 'P'].includes(pos)) return 'k';
            return 'qb'; // default
        }

        // Convert team abbreviations to readable format and logo names
        function convertTeamName(teamAbbr) {
            const teamMap = {
                'TAM': 'TB', 'GNB': 'GB', 'NWE': 'NE', 'KAN': 'KC', 'SFO': 'SF',
                'NOR': 'NO', 'RAM': 'LAR', 'SDG': 'SD', 'CHI': 'CHI',
                'WAS': 'WAS', 'HOU': 'HOU', 'STL': 'STL', 'BAL': 'BAL',
                'OAK': 'LV', 'ARI': 'ARI', 'ATL': 'ATL', 'BUF': 'BUF',
                'CAR': 'CAR', 'CIN': 'CIN', 'CLE': 'CLE', 'DAL': 'DAL',
                'DEN': 'DEN', 'DET': 'DET', 'IND': 'IND', 'JAX': 'JAX',
                'MIA': 'MIA', 'MIN': 'MIN', 'NYG': 'NYG', 'NYJ': 'NYJ',
                'PHI': 'PHI', 'PIT': 'PIT', 'SEA': 'SEA', 'TEN': 'TEN'
            };
            return teamMap[teamAbbr] || teamAbbr;
        }
        
        // Get logo filename for team
        function getTeamLogo(teamAbbr) {
            const logoMap = {
                'TB': 'buccaneers.png',
                'TAM': 'buccaneers.png',
                'GB': 'packers.png',
                'GNB': 'packers.png',
                'NE': 'patriots.png',
                'NWE': 'patriots.png',
                'KC': 'chiefs.png',
                'KAN': 'chiefs.png',
                'SF': '49ers.png',
                'SFO': '49ers.png',
                'NO': 'saints.png',
                'NOR': 'saints.png',
                'LAR': 'rams.png',
                'RAM': 'rams.png',
                'SD': 'chargers.png',
                'SDG': 'chargers.png',
                'CHI': 'bears.png',
                'WAS': 'redskins.png',
                'HOU': 'texans.png',
                'STL': 'rams.png',
                'BAL': 'ravens.png',
                'LV': 'raiders.png',
                'OAK': 'raiders.png',
                'ARI': 'cardinals.png',
                'ATL': 'falcons.png',
                'BUF': 'bills.png',
                'CAR': 'panthers.png',
                'CIN': 'bengals.png',
                'CLE': 'browns.png',
                'DAL': 'cowboys.png',
                'DEN': 'broncos.png',
                'DET': 'lions.png',
                'IND': 'colts.png',
                'JAX': 'jaguars.png',
                'MIA': 'dolphins.png',
                'MIN': 'vikings.png',
                'NYG': 'giants.png',
                'NYJ': 'jets.png',
                'PHI': 'eagles.png',
                'PIT': 'steelers.png',
                'SEA': 'seahawks.png',
                'TEN': 'titans.png'
            };
            return logoMap[teamAbbr] || 'raiders.png'; // default
        }

        const rawData = parseCSV(csvData);
        
        // Process the data
        const playersData = rawData.map(row => ({
            name: row.Player,
            pos: row.Pos,
            year: parseInt(row.Year),
            round: parseInt(row.Rnd),
            pick: parseInt(row.Pick),
            team: convertTeamName(row.Tm),
            teamOriginal: row.Tm,
            highlighted: row.Pos === 'QB',
            posCategory: categorizePosition(row.Pos)
        }));

        // Calculate statistics by position
        const positionStats = {
            qb: playersData.filter(p => p.posCategory === 'qb').length,
            rb: playersData.filter(p => p.posCategory === 'rb').length,
            wr: playersData.filter(p => p.posCategory === 'wr').length,
            te: playersData.filter(p => p.posCategory === 'te').length,
            ol: playersData.filter(p => p.posCategory === 'ol').length,
            dl: playersData.filter(p => p.posCategory === 'dl').length,
            lb: playersData.filter(p => p.posCategory === 'lb').length,
            db: playersData.filter(p => p.posCategory === 'db').length,
            k: playersData.filter(p => p.posCategory === 'k').length
        };

        const stats = {
            total: playersData.length,
            firstRound: playersData.filter(p => p.round === 1).length
        };

        // Update legend with position stats
        document.getElementById('qb-count').textContent = positionStats.qb;
        document.getElementById('rb-count').textContent = positionStats.rb;
        document.getElementById('wr-count').textContent = positionStats.wr;
        document.getElementById('te-count').textContent = positionStats.te;
        document.getElementById('ol-count').textContent = positionStats.ol;
        document.getElementById('dl-count').textContent = positionStats.dl;
        document.getElementById('lb-count').textContent = positionStats.lb;
        document.getElementById('db-count').textContent = positionStats.db;
        document.getElementById('k-count').textContent = positionStats.k;
        document.getElementById('total-count').textContent = stats.total;
        document.getElementById('total-players').textContent = `${stats.total} Players Drafted`;
        document.getElementById('first-rounders').textContent = `${stats.firstRound} First Round Picks`;

        // Calculate team statistics for chart
        const teamStats = {};
        playersData.forEach(player => {
            const team = player.team;
            if (!teamStats[team]) {
                teamStats[team] = {
                    count: 0,
                    original: player.teamOriginal,
                    players: []
                };
            }
            teamStats[team].count++;
            teamStats[team].players.push(player);
        });

        // Sort teams by player count
        const sortedTeams = Object.entries(teamStats)
            .sort(([,a], [,b]) => b.count - a.count)
            .slice(0, 15); // Show top 15 teams

        // Create team chart
        const teamBarsContainer = document.getElementById('teamBars');
        const maxCount = sortedTeams[0][1].count;

        sortedTeams.forEach(([team, data]) => {
            const teamBar = document.createElement('div');
            teamBar.className = 'team-bar';
            
            const logoUrl = `https://raw.githubusercontent.com/klunn91/team-logos/master/NFL/${getTeamLogo(data.original)}`;
            const barWidth = (data.count / maxCount) * 100;
            
            teamBar.innerHTML = `
                <img src="${logoUrl}" alt="${team}" class="team-logo-large" onerror="this.style.display='none'">
                <div class="team-info">
                    <div class="team-name">${team}</div>
                    <div class="team-count">${data.count} player${data.count > 1 ? 's' : ''}</div>
                    <div class="team-bar-fill" style="width: ${barWidth}%;"></div>
                </div>
            `;
            
            teamBarsContainer.appendChild(teamBar);
        });

        // Group players by year
        const playersByYear = {};
        playersData.forEach(player => {
            if (!playersByYear[player.year]) {
                playersByYear[player.year] = [];
            }
            playersByYear[player.year].push(player);
        });

        // Sort years descending (most recent first)
        const years = Object.keys(playersByYear).map(Number).sort((a, b) => b - a);

        function createPlayerNode(player) {
            const node = document.createElement('div');
            const posCategory = player.posCategory;
            
            node.className = `player-node ${player.highlighted ? 'highlighted' : ''} ${posCategory}-player`;
            
            const roundText = player.round === 1 ? '1st' : 
                             player.round === 2 ? '2nd' : 
                             player.round === 3 ? '3rd' : 
                             `${player.round}th`;

            const logoUrl = `https://raw.githubusercontent.com/klunn91/team-logos/master/NFL/${getTeamLogo(player.teamOriginal)}`;

            node.innerHTML = `
                <div class="player-name">${player.name}</div>
                <div class="player-pos">${player.pos}</div>
                <img src="${logoUrl}" alt="${player.team}" class="team-logo" onerror="this.style.display='none'">
                <div class="draft-info">${roundText}-${player.pick}<br>${player.team}</div>
            `;

            return node;
        }

        const yearGroupsContainer = document.getElementById('yearGroups');

        years.forEach(year => {
            const yearGroup = document.createElement('div');
            yearGroup.className = 'year-group';

            const yearLabel = document.createElement('div');
            yearLabel.className = 'year-label';
            yearLabel.textContent = year;

            const playersRow = document.createElement('div');
            playersRow.className = 'players-row';

            const branchLine = document.createElement('div');
            branchLine.className = 'branch-line';
            playersRow.appendChild(branchLine);

            // Sort players by round within each year
            const sortedPlayers = playersByYear[year].sort((a, b) => a.round - b.round || a.pick - b.pick);
            
            sortedPlayers.forEach(player => {
                playersRow.appendChild(createPlayerNode(player));
            });

            yearGroup.appendChild(yearLabel);
            yearGroup.appendChild(playersRow);
            yearGroupsContainer.appendChild(yearGroup);
        });
    </script>
</body>
